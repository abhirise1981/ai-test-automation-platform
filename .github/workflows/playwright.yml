name: Web & API Automation (Playwright)
on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 2 * * *' # Runs every day at 2:00 AM UTC (Nightly Regression)
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key to run AI Pipeline'
        required: false
        default: 'PROJ-123'
      test_suite:
        description: 'Select Test Suite to Run'
        required: true
        default: 'Regression'
        type: choice
        options:
          - Regression
          - Smoke
  repository_dispatch:
    types: [jira-webhook-trigger]

permissions:
  contents: write

jobs:
  web-api-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run AI Agent Pipeline (If Webhook / Dispatch Triggered)
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
      run: npx ts-node agents/pipeline.ts --issue ${{ github.event.inputs.issue_key || github.event.client_payload.issue_key || 'PROJ-123' }} --dry-run
    - name: Run Playwright Tests (Web UI & API)
      run: |
        if [[ "${{ github.event_name }}" == "pull_request" || "${{ github.event_name }}" == "schedule" || "${{ github.event.inputs.test_suite }}" == "Smoke" ]]; then
          echo "Running Smoke Suite..."
          npx playwright test --grep @smoke
        else
          echo "Running Full Regression Suite..."
          npx playwright test
        fi
    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30
    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
