name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      issue_key:
        description: 'Jira Issue Key to run AI Pipeline'
        required: false
        default: 'PROJ-123'
  repository_dispatch:
    types: [jira-webhook-trigger]

permissions:
  contents: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run AI Agent Pipeline (If Webhook / Dispatch Triggered)
      if: github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
      run: npx ts-node agents/pipeline.ts --issue ${{ github.event.inputs.issue_key || github.event.client_payload.issue_key || 'PROJ-123' }} --dry-run
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 30
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-and-rich-report
        path: test-results/
        retention-days: 30
    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      if: always()
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./playwright-report
